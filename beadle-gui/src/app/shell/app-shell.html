<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" routerLink="/">
        <span class="brand-name"><strong>BBH</strong> {{ name }}</span>
      </a>
      <nav class="menu" aria-label="Main">
        @for (section of sections(); track section.path) {
          <a
            class="menu-link"
            [routerLink]="section.path"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            >{{ section.label }}</a
          >
        }
      </nav>
      @if (user(); as user) {
        <div class="user-badge" [attr.title]="user.email">
          <span class="user-icon" aria-hidden="true">👤</span>
          <span class="user-name">{{ user.name }}</span>
          <button
            type="button"
            class="sign-out"
            [disabled]="signingOut()"
            [attr.aria-busy]="signingOut() || null"
            (click)="signOut()"
          >
            Sign out
          </button>
        </div>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet (activate)="sessionEnd.shown($event)" (deactivate)="sessionEnd.hidden($event)" />
  </main>

  <footer class="footer">
    <span>BBH 2026</span>
  </footer>
</div>
