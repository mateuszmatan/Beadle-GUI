spring:
  application:
    name: beadle
  profiles:
    default: local
    group:
      rd: oracle
      qc: oracle
      prod: oracle
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
          preferred_boolean_jdbc_type: INTEGER
        default_batch_fetch_size: 50
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    analytics-enabled: false
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 30s

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.bbh.itss.beadle: INFO

beadle:
  auth:
    mode: oidc
  services:
    token: ${BEADLE_SERVICE_TOKEN:}
    internal:
      url: ${BEADLE_INTERNAL_URL}
    protech:
      url: ${BEADLE_PROTECH_URL}
  demo-data: false
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:h2:file:${BEADLE_DATA_DIR:${user.home}/beadle}/beadle;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: com.bbh.itss.beadle.adapter.out.persistence.OracleModeH2Dialect
management:
  endpoint:
    health:
      show-details: always
beadle:
  demo-data: ${BEADLE_DEMO_DATA:true}
  auth:
    mode: local
    user: ${BEADLE_SIGNED_IN_USER:Mateusz Matan}
  services:
    internal:
      url: ${BEADLE_INTERNAL_URL:http://localhost:8082}
    protech:
      url: ${BEADLE_PROTECH_URL:http://localhost:8083}
---
spring:
  config:
    activate:
      on-profile: rd | qc | prod
  security:
    oauth2:
      client:
        registration:
          ping:
            provider: ping
            client-name: Ping
            client-id: ${PING_CLIENT_ID}
            client-secret: ${PING_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope: openid, profile, email
        provider:
          ping:
            issuer-uri: ${PING_ISSUER_URI}
server:
  forward-headers-strategy: native
---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
---
spring:
  config:
    activate:
      on-profile: rd
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
logging:
  level:
    com.bbh.itss.beadle: DEBUG
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
