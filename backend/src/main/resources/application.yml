spring:
  application:
    name: beadle
  profiles:
    default: local
    group:
      rd: oracle
      qc: oracle
      prod: oracle
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
          preferred_boolean_jdbc_type: INTEGER
        default_batch_fetch_size: 50
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    analytics-enabled: false
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.bbh.itss.beadle: INFO

beadle:
  gui:
    pages: changes, new-change, admin
  cybertrack:
    url: ${CYBERTRACK_URL:}
    token: ${CYBERTRACK_TOKEN:}
    project-key: ${CYBERTRACK_PROJECT_KEY:SCP}
    issue-type: ${CYBERTRACK_ISSUE_TYPE:Task}
  demo-data: false
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:h2:file:${BEADLE_DATA_DIR:${user.home}/bbh-devsecops/beadle}/beadle;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
management:
  endpoint:
    health:
      show-details: always
beadle:
  demo-data: ${BEADLE_DEMO_DATA:true}
---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
---
spring:
  config:
    activate:
      on-profile: rd
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
management:
  endpoint:
    health:
      show-details: always
logging:
  level:
    com.bbh.itss.beadle: DEBUG
---
spring:
  config:
    activate:
      on-profile: qc
management:
  endpoint:
    health:
      show-details: always
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
