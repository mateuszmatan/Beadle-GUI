apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: beadle
      app.kubernetes.io/part-of: beadle
resources:
  - deployment.yaml
  - service.yaml
  - route.yaml
configMapGenerator:
  - name: beadle-config
    literals:
      - BEADLE_INTERNAL_URL=http://beadle-internal:8082
      - BEADLE_PROTECH_URL=http://beadle-protech:8083
      # SPRING_PROFILES_ACTIVE and PING_ISSUER_URI, the Ping issuer of the environment, are set in each overlay; the
      # client id and secret are in the secret beadle-oidc.
