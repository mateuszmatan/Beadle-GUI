apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: beadle
      app.kubernetes.io/part-of: beadle
resources:
  - deployment.yaml
  - service.yaml
  - route.yaml
configMapGenerator:
  - name: beadle-config
    literals:
      - SPRING_PROFILES_ACTIVE=rd
      - BEADLE_INTERNAL_URL=http://beadle-internal:8082
      - BEADLE_PROTECH_URL=http://beadle-protech:8083
      - BEADLE_AUTH_MODE=oidc
      # The Ping issuer of the environment, set in each overlay; the client id and secret are in the secret beadle-oidc.
      - PING_ISSUER_URI=
