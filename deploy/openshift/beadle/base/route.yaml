apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: beadle
  annotations:
    # Two pods: the router's sticky cookie keeps a browser on the pod that holds its Ping session.
    router.openshift.io/cookie_name: beadle-route
spec:
  to:
    kind: Service
    name: beadle
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
